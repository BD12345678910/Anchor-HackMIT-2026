<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anchor Focus Adapter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">ANCHOR</p>
    <h1>Page focus tools</h1>
    <p class="intro">These controls affect only pages where you click the Anchor extension. Password, payment, and browser-internal pages are always excluded.</p>
    <section>
      <label class="toggle"><input id="imageBlur" type="checkbox"> Dynamically soften distracting images</label>
      <label for="threshold">Image threshold <output id="thresholdValue"></output></label>
      <input id="threshold" type="range" min="0.3" max="0.9" step="0.05">
      <label class="toggle"><input id="futureTextMask" type="checkbox"> Hide future paragraphs while reading</label>
      <label for="lookahead">Visible paragraphs ahead</label>
      <input id="lookahead" type="number" min="0" max="8">
    </section>
    <section>
      <label for="deniedOrigins">Never run on these origins <span>(one per line)</span></label>
      <textarea id="deniedOrigins" rows="6" placeholder="https://example.com"></textarea>
    </section>
    <div class="actions"><button id="save">Save locally</button><span id="status" role="status"></span></div>
  </main>
  <script src="options.js"></script>
</body>
</html>

syntax = "proto3";

package anchor.v1;
option csharp_namespace = "Anchor.Contracts";

service InferenceWorker {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc PredictAttention(PredictAttentionRequest) returns (AttentionPredictionReply);
  rpc AnalyzeFrame(AnalyzeFrameRequest) returns (AnalyzeFrameReply);
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasReply);
  rpc ConfigureGaze(ConfigureGazeRequest) returns (GazeConfigurationReply);
  rpc StartGaze(StartGazeRequest) returns (GazeStatusReply);
  rpc ReadGaze(ReadGazeRequest) returns (GazeSampleReply);
  rpc AddCalibrationSample(AddCalibrationSampleRequest) returns (CalibrationProgressReply);
  rpc FinishCalibration(FinishCalibrationRequest) returns (CalibrationResultReply);
  rpc StopGaze(StopGazeRequest) returns (GazeStatusReply);
  rpc StartRecording(StartRecordingRequest) returns (RecordingManifestReply);
  rpc AppendRecordingEvent(AppendRecordingEventRequest) returns (RecordingStatusReply);
  rpc AppendRecordingSample(AppendRecordingSampleRequest) returns (RecordingStatusReply);
  rpc GetRecordingStatus(GetRecordingStatusRequest) returns (RecordingStatusReply);
  rpc StopRecording(StopRecordingRequest) returns (RecordingStatusReply);
  rpc Shutdown(ShutdownRequest) returns (ShutdownReply);
}

message HealthRequest {
  uint32 protocol_version = 1;
}

message HealthResponse {
  uint32 protocol_version = 1;
  string worker_version = 2;
  Capability camera = 3;
  Capability visual_analysis = 4;
}

message Capability {
  bool available = 1;
  string reason = 2;
}

message SensorWindowMessage {
  int64 timestamp_unix_ms = 1;
  uint32 key_count = 2;
  double mouse_distance = 3;
  double idle_seconds = 4;
  double app_relevance = 5;
  double gaze_presence = 6;
  uint32 app_switch_count = 7;
  uint32 scroll_reversal_count = 8;
  bool gaze_available = 9;
  bool manual_report = 10;
}

message PredictAttentionRequest {
  SensorWindowMessage sensor_window = 1;
}

message AttentionPredictionReply {
  double distraction_probability = 1;
  double confidence = 2;
  repeated string reason_codes = 3;
  uint32 latency_ms = 4;
}

message AnalyzeFrameRequest {
  bytes jpeg = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message AnalyzeFrameReply {
  oneof outcome {
    VisualAnalysis analysis = 1;
    Unavailable unavailable = 2;
  }
}

message VisualAnalysis {
  double salience = 1;
  double motion = 2;
  repeated VisualRegion regions = 3;
}

message VisualRegion {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
  double salience = 5;
}

message Unavailable {
  string reason = 1;
}

message ListCamerasRequest {}

message CameraDeviceMessage {
  uint32 index = 1;
  string name = 2;
}

message ListCamerasReply {
  repeated CameraDeviceMessage devices = 1;
  Unavailable unavailable = 2;
}

message GazeConfigurationMessage {
  uint32 camera_index = 1;
  bool mirror = 2;
  int32 rotation_degrees = 3;
  double offset_x = 4;
  double offset_y = 5;
  double smoothing = 6;
  double sensitivity = 7;
  double min_confidence = 8;
}

message ConfigureGazeRequest {
  GazeConfigurationMessage configuration = 1;
  string display_signature = 2;
}

message GazeConfigurationReply {
  bool accepted = 1;
  string error = 2;
  GazeConfigurationMessage configuration = 3;
}

message StartGazeRequest {}
message StopGazeRequest {}

message GazeStatusReply {
  bool running = 1;
  string error = 2;
}

message ReadGazeRequest {}

message GazePoint {
  double x = 1;
  double y = 2;
}

message GazeSampleReply {
  oneof outcome {
    GazePoint point = 1;
    Unavailable unavailable = 2;
  }
  double confidence = 3;
  bool face_present = 4;
  int64 timestamp_unix_ms = 5;
  double yaw = 6;
  double pitch = 7;
  double roll = 8;
  bytes preview_jpeg = 9;
}

message AddCalibrationSampleRequest {
  double target_x = 1;
  double target_y = 2;
}

message CalibrationProgressReply {
  bool accepted = 1;
  uint32 sample_count = 2;
  string error = 3;
}

message FinishCalibrationRequest {
  string display_signature = 1;
}

message CalibrationResultReply {
  bool accepted = 1;
  uint32 sample_count = 2;
  uint32 inlier_count = 3;
  double median_error = 4;
  string error = 5;
}

message StartRecordingRequest {
  string output_directory = 1;
  string trial_mode = 2;
  string participant_code = 3;
  uint32 display_index = 4;
  uint32 fps = 5;
}

message RecordingManifestReply {
  bool accepted = 1;
  string error = 2;
  string trial_id = 3;
  string trial_mode = 4;
  string video_path = 5;
  string events_path = 6;
  string samples_path = 7;
  string summary_path = 8;
  string manifest_path = 9;
}

message AppendRecordingEventRequest { string json = 1; }
message AppendRecordingSampleRequest { string json = 1; }
message GetRecordingStatusRequest {}
message StopRecordingRequest {}

message RecordingStatusReply {
  string trial_id = 1;
  string status = 2;
  uint32 frame_count = 3;
  uint32 dropped_frames = 4;
  double elapsed_seconds = 5;
  bool video_usable = 6;
  string error_code = 7;
}

message ShutdownRequest {}
message ShutdownReply { bool accepted = 1; }

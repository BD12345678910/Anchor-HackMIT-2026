[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-worker"
version = "0.1.0"
description = "Local multimodal inference worker for Anchor"
requires-python = ">=3.11,<3.13"
dependencies = [
  "grpcio==1.62.3",
  "grpcio-tools==1.62.3",
  "contourpy==1.3.3",
  "jax==0.4.38",
  "jaxlib==0.4.38",
  "mediapipe==0.10.14",
  "mss==10.1.0",
  "ml-dtypes==0.4.1",
  "numpy>=1.26,<2",
  "opencv-contrib-python==4.11.0.86",
  "protobuf>=4.25.3,<5",
  "scipy==1.14.1",
  "sentencepiece==0.2.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
]
build = [
  "pyinstaller==6.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["."]
include = ["anchor_worker*"]

[tool.setuptools.package-data]
anchor_worker = ["models/*.task"]
